name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: macos-26
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'NuGet.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Install Linux display, WebCore and Vulkan runtime dependencies
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            xvfb xauth dbus-x11 fonts-dejavu-core mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri \
            libglib2.0-0t64 libharfbuzz0b libharfbuzz-icu0 libicu74 libjpeg-turbo8 libepoxy0 libgcrypt20 \
            libsoup-3.0-0 libtasn1-6 libxkbcommon0 libxml2 libpng16-16t64 libsqlite3-0 \
            libwebp7 libwebpdemux2 libwebpmux3 libatomic1 libfreetype6 libfontconfig1 libwoff1 libdrm2 libegl1 libgles2
      - name: Fetch pinned wgpu-native runtime (${{ matrix.rid }})
        run: python scripts/fetch_wgpu_native.py --rid ${{ matrix.rid }}
      - name: Build solution
        run: dotnet build Ranvier.Wgpu.sln -c Release
      - name: Run Ranvier.Wgpu.Tests (Windows / macOS)
        if: matrix.rid != 'linux-x64'
        run: dotnet run --project tests/Ranvier.Wgpu.Tests -c Release --no-build
      - name: Run Ranvier.Wgpu.Tests (Linux Xvfb)
        if: matrix.rid == 'linux-x64'
        env:
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a dotnet run --project tests/Ranvier.Wgpu.Tests -c Release --no-build

  # Fable.Ranvier.Wgpu: compiled to JavaScript with the pinned Fickl tool, then tested under Node and in the
  # runner's own Chrome against a render by the native package on the same machine.
  browser:
    name: Browser package (win-x64)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/Fable.Ranvier.Wgpu.Tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'NuGet.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Fetch pinned wgpu-native runtime (win-x64)
        working-directory: .
        run: python scripts/fetch_wgpu_native.py --rid win-x64
      - name: Restore the Fickl tool
        run: dotnet tool restore
      - name: Install npm packages
        run: npm ci
      - name: Compile to JavaScript with Fickl
        run: npm run compile
      - name: Byte layouts and camera matrix against .NET (Node)
        run: npm test
      - name: Render the shared scene with the native package
        run: npm run golden
      - name: Draw and pick in headless Chrome
        run: npm run test:browser

  packages:
    name: Packages
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', 'Directory.Build.props', 'NuGet.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Check formatting with Fantomas
        run: |
          dotnet tool restore
          dotnet tool run fantomas --check \
            src/Ranvier.Wgpu/Native.fs \
            src/Ranvier.Wgpu/Types.fs \
            src/Ranvier.Wgpu/Primitives.fs \
            src/Ranvier.Wgpu/Shaders.fs \
            src/Ranvier.Wgpu/Batches.fs \
            src/Ranvier.Wgpu/ScenePass.fs \
            src/Ranvier.Wgpu/WgpuContext.fs \
            src/Ranvier.Wgpu.Sdl/WgpuSdlSurface.fs \
            tests/Ranvier.Wgpu.Tests/Program.fs \
            src/Fable.Ranvier.Wgpu \
            tests/Shared \
            tests/Fable.Ranvier.Wgpu.Golden/Program.fs \
            tests/Fable.Ranvier.Wgpu.Tests/PackingChecks.fs \
            tests/Fable.Ranvier.Wgpu.Tests/BrowserChecks.fs \
            samples/FableRanvierWgpuWaves/App.fs
      - name: Check bindings generator determinism
        run: |
          python tools/gen_bindings.py
          git diff --exit-code src/Ranvier.Wgpu/Generated/WgpuBindings.fs
      - name: Fetch pinned wgpu-native runtimes for all 6 RIDs
        run: python scripts/fetch_wgpu_native.py
      - name: Pack NuGet packages (untraced and traced)
        run: |
          dotnet pack src/Ranvier.Wgpu/Ranvier.Wgpu.fsproj -c Release -o artifacts/nupkg
          dotnet pack src/Ranvier.Wgpu.Sdl/Ranvier.Wgpu.Sdl.fsproj -c Release -o artifacts/nupkg
          dotnet pack src/Ranvier.Wgpu.Sdl/Ranvier.Wgpu.Sdl.fsproj -c Release -p:RanvierTrace=true -o artifacts/nupkg
          dotnet pack src/Fable.Ranvier.Wgpu/Fable.Ranvier.Wgpu.fsproj -c Release -o artifacts/nupkg
      - name: Verify multi-RID native layout and consumer restore
        run: |
          python - <<'PY'
          import subprocess, tempfile, zipfile
          from pathlib import Path

          nupkgs = sorted(Path('artifacts/nupkg').glob('*.nupkg'))
          names = [p.name for p in nupkgs]
          print('Packed:', names)
          assert len(nupkgs) == 4, f'Expected 4 packages, got {names}'

          wgpu_pkg = next(p for p in nupkgs if p.name.startswith('Ranvier.Wgpu.0.') or p.name.startswith('Ranvier.Wgpu.1.'))
          expected_entries = {
              'runtimes/win-x64/native/wgpu_native.dll',
              'runtimes/win-arm64/native/wgpu_native.dll',
              'runtimes/linux-x64/native/libwgpu_native.so',
              'runtimes/linux-arm64/native/libwgpu_native.so',
              'runtimes/osx-arm64/native/libwgpu_native.dylib',
              'runtimes/osx-x64/native/libwgpu_native.dylib',
              'README.md',
              'THIRD-PARTY-NOTICES.md',
              'ranvier-icon.png',
          }
          with zipfile.ZipFile(wgpu_pkg) as zf:
              entries = set(zf.namelist())
              missing = expected_entries - entries
              assert not missing, f'Missing entries in {wgpu_pkg.name}: {missing}'

          feed = str(Path('artifacts/nupkg').resolve())
          with tempfile.TemporaryDirectory() as tmp:
              td = Path(tmp)
              (td / 'Consumer.fsproj').write_text(
                  '<Project Sdk="Microsoft.NET.Sdk">\n'
                  '  <PropertyGroup>\n'
                  '    <OutputType>Exe</OutputType>\n'
                  '    <TargetFramework>net10.0</TargetFramework>\n'
                  '  </PropertyGroup>\n'
                  '  <ItemGroup>\n'
                  '    <Compile Include="Program.fs" />\n'
                  '    <PackageReference Include="Ranvier.Wgpu.Sdl" Version="*-*" />\n'
                  '  </ItemGroup>\n'
                  '</Project>\n',
                  encoding='utf-8',
              )
              (td / 'Program.fs').write_text(
                  'open Ranvier.Wgpu\n'
                  'let c = RgbaColor.fromHex "#0ea5e9"\n'
                  'printfn "%f" c.B\n',
                  encoding='utf-8',
              )
              subprocess.run(
                  ['dotnet', 'build', str(td / 'Consumer.fsproj'), '-c', 'Release',
                   '--source', feed, '--source', 'https://api.nuget.org/v3/index.json'],
                  check=True,
              )
          PY
      - name: Verify the browser package compiles from a consumer with Fickl
        run: |
          python - <<'PY'
          import os, subprocess, tempfile, zipfile
          from pathlib import Path

          # Fickl compiles a library package from the sources in its fable/ folder.
          pkg = next(Path('artifacts/nupkg').glob('Fable.Ranvier.Wgpu.*.nupkg'))
          version = pkg.name[len('Fable.Ranvier.Wgpu.'):-len('.nupkg')]
          expected = {'fable/Fable.Ranvier.Wgpu.fsproj', 'lib/net10.0/Fable.Ranvier.Wgpu.dll', 'README.md', 'ranvier-icon.png'}
          expected |= {f'fable/{name}.fs' for name in (
              'Types', 'Primitives', 'Shaders', 'GlslShaders', 'WebGpu', 'WebGl2', 'Packing', 'Backend',
              'WebGpuBackend', 'WebGl2Backend', 'Batches', 'ScenePass', 'WgpuContext')}
          with zipfile.ZipFile(pkg) as zf:
              entries = set(zf.namelist())
              missing = expected - entries
              assert not missing, f'Missing entries in {pkg.name}: {missing}'
              project = zf.read('fable/Fable.Ranvier.Wgpu.fsproj').decode()
          # Every Compile item of the packed project file must name a file packed beside it.
          import re
          for include, link in re.findall(r'<Compile Include="([^"]+)"\s*(?:/>|>\s*<Link>([^<]+)</Link>)', project):
              name = (link or include).removeprefix('./')
              assert f'fable/{name}' in entries, f'{include} is compiled by the package and not packed as fable/{name}'

          repo = Path.cwd()
          feed = str(Path('artifacts/nupkg').resolve())
          with tempfile.TemporaryDirectory() as tmp:
              td = Path(tmp)
              (td / 'NuGet.config').write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n'
                  f'    <add key="local" value="{feed}" />\n'
                  '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />\n'
                  '  </packageSources>\n</configuration>\n',
                  encoding='utf-8',
              )
              (td / 'Consumer.fsproj').write_text(
                  '<Project Sdk="Microsoft.NET.Sdk">\n'
                  '  <PropertyGroup>\n'
                  '    <OutputType>Exe</OutputType>\n'
                  '    <TargetFramework>net10.0</TargetFramework>\n'
                  '  </PropertyGroup>\n'
                  '  <ItemGroup>\n'
                  '    <Compile Include="Program.fs" />\n'
                  f'    <PackageReference Include="Fable.Ranvier.Wgpu" Version="{version}" />\n'
                  '  </ItemGroup>\n'
                  '</Project>\n',
                  encoding='utf-8',
              )
              # The quick start of the package's README, then values that need no browser.
              (td / 'Program.fs').write_text(
                  'module Consumer\n'
                  'open System.Numerics\n'
                  'open Fickl.Core\n'
                  'open Ranvier.Wgpu\n'
                  'let draw (canvas: obj) =\n'
                  '    jsAsync {\n'
                  '        let! ctx = WgpuContext.CreateAsync (canvas)\n'
                  '        let mesh = ctx.UploadMesh (Primitives.unitIcosphere 3)\n'
                  '        let batch = ctx.CreateBatch mesh\n'
                  '        batch.SetSingle (Instance3D.sphere Vector3.Zero 2.0f (RgbaColor.fromHex "#3b82f6") 0.28f 1u InstanceFlags.None)\n'
                  '        let camera = Camera3D.orbit Vector3.Zero 0.6f 0.4f 5.0f 45.0f\n'
                  '        let pass =\n'
                  '            ScenePass.create camera\n'
                  '            |> ScenePass.withClear (RgbaColor.fromHex "#090d16")\n'
                  '            |> ScenePass.withBatches [| batch |]\n'
                  '        ctx.Render pass |> ignore\n'
                  '        let! hit = ctx.PickAsync (ctx.Width / 2, ctx.Height / 2, pass)\n'
                  '        return hit\n'
                  '    }\n'
                  'let color = RgbaColor.fromHex "#0ea5e9"\n'
                  'printfn "blue %.3f; glsl %b; backend %A" color.B (GlslShaders.DefaultSceneGlsl.Length > 0) WgpuBrowserBackend.Auto\n',
                  encoding='utf-8',
              )
              (td / 'package.json').write_text('{ "type": "module" }\n', encoding='utf-8')
              # A package folder of its own, so the package just packed is not taken from the cache.
              env = dict(os.environ, NUGET_PACKAGES=str(td / 'packages'))
              subprocess.run(['dotnet', 'fickl', str(td / 'Consumer.fsproj'), '--outDir', str(td / 'out')],
                             check=True, cwd=repo, env=env)
              ran = subprocess.run(['node', str(td / 'out' / 'Program.js')], check=True, capture_output=True, text=True)
              print(ran.stdout)
              assert ran.stdout.strip() == 'blue 0.914; glsl true; backend Auto', ran.stdout
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
